services:
  # FastAPI Backend
  - type: web
    name: smartshop-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_MODEL_NAME
        value: command-a-03-2025
      - key: TAVILY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        value: "whatsapp:+14155238886"
      - key: REDIS_URL
        fromService:
          name: smartshop-redis
          type: redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
    buildCommand: ""
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000

  # Redis Cache (Render managed Redis)
  - type: redis
    name: smartshop-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
